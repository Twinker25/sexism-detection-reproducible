services:
  mlflow-server:
    image: cs-experiment:v1.0
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sexism-mlflow-ui
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/app/mlruns
    command: >
      mlflow server
      --backend-store-uri file:///app/mlruns
      --default-artifact-root file:///app/mlruns
      --host 0.0.0.0
      --port 5000

  experiment:
    image: cs-experiment:v1.0
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sexism-experiment-runner
    depends_on:
      - mlflow-server
    environment:
      - DATA_DIR=/app/data
      - MLFLOW_TRACKING_URI=http://mlflow-server:5000
    volumes:
      - ./data:/app/data:ro
      - ./mlruns:/app/mlruns
    command: ["python", "train.py"]